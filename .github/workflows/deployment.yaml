name: Deployment-CI-Pipeline-Conduit-Container

on: 
  push:
    branches: 
      - dev

permissions:
  contents: read
  packages: write

jobs: 
  build:
    name: Build & Push Images
    runs-on: ubuntu-22.04
    
    steps: 
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./conduit-frontend
          file: ./conduit-frontend/frontend.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/conduit-container/frontend:${{ github.ref_name }}

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./conduit-backend
          file: ./conduit-backend/backend.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/conduit-container/backend:${{ github.ref_name }}

      - name: Create .env file
        run: |
          cat << EOF > .env
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          FRONTEND_PORT=${{ secrets.FRONTEND_PORT }}
          BACKEND_URL=${{ secrets.BACKEND_URL }}
          BACKEND_PORT=${{ secrets.BACKEND_PORT }}
          DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG=${{ secrets.DJANGO_DEBUG }}
          DJANGO_SUPERUSER_EMAIL=${{ secrets.DJANGO_SUPERUSER_EMAIL }}
          DJANGO_SUPERUSER_USERNAME=${{ secrets.DJANGO_SUPERUSER_USERNAME }}
          DJANGO_SUPERUSER_PASSWORD=${{ secrets.DJANGO_SUPERUSER_PASSWORD }}
          EOF
        shell: bash

