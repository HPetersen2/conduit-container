name: Deployment-CI-Pipeline-Conduit-Container

on: 
  push:
    branches: 
      - dev

jobs: 
  build:
    name: Build & Push Images
    runs-on: ubuntu-22.04
    
    steps: 
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/frontend.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/conduit-container/frontend:${{ github.ref_name }}

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/backend.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/conduit-container/backend:${{ github.ref_name }}

