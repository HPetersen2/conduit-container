name: Deployment-CI-Pipeline-Conduit-Container

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & Push Images
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./conduit-frontend
          file: ./conduit-frontend/frontend.Dockerfile
          push: true
          build-args: |
            BACKEND_API_URL=${{ secrets.BACKEND_API_URL }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/conduit-container/frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/conduit-container/frontend:latest

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./conduit-backend
          file: ./conduit-backend/backend.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/conduit-container/backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/conduit-container/backend:latest

  deploy:
    name: Deploy Application
    runs-on: ubuntu-22.04
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          mkdir -p deploy
          cat <<EOF > deploy/.env
          BACKEND_API_URL=${{ secrets.BACKEND_API_URL }}

          DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_LOGLEVEL=${{ secrets.DJANGO_LOGLEVEL }}
          DEBUG=${{ secrets.DEBUG }}
          DJANGO_ALLOWED_HOSTS=${{ secrets.DJANGO_ALLOWED_HOSTS }}

          CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
          CSRF_TRUSTED_ORIGINS=${{ secrets.CSRF_TRUSTED_ORIGINS }}
          CORS_ALLOW_CREDENTIALS=${{ secrets.CORS_ALLOW_CREDENTIALS }}
          CORS_ORIGIN_WHITELIST=${{ secrets.CORS_ORIGIN_WHITELIST }}

          DATABASE_ENGINE=${{ secrets.DATABASE_ENGINE }}
          DATABASE_NAME=${{ secrets.DATABASE_NAME }}
          DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
          DATABASE_HOST=${{ secrets.DATABASE_HOST }}
          DATABASE_PORT=${{ secrets.DATABASE_PORT }}
          EOF
        shell: bash

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add known hosts
        run: |
          ssh-keyscan -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts

      - name: Copy files to server
        run: |
          scp deploy/.env ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:${{ vars.PATH_TO_PROJECT_FOLDER }}/.env
          scp docker-compose.yml ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:${{ vars.PATH_TO_PROJECT_FOLDER }}/docker-compose.yml

      - name: Deploy on remote VM
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} << 'EOF'
            cd ${{ vars.PATH_TO_PROJECT_FOLDER }}
            docker compose pull
            docker compose down --remove-orphans
            docker compose up -d
          EOF
